name: CI Build and Test Container

# Build and test on all branches with pull request to main branch
on:
  pull_request:
    branches:
      - main

# Nothing is pushed, so a read-only token is enough. This also lets pull
# requests from forks pass, which only ever get a read-only token.
permissions:
  contents: read

jobs:
  # Build and test natively on every architecture that main.yml publishes
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: nginx-static:test

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the image into the local Docker engine, no registry involved
      - name: Build the Docker image
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: ${{ env.IMAGE }}

      - name: Check image architecture
        run: |
          test "$(docker image inspect -f '{{.Architecture}}' "$IMAGE")" = "${{ matrix.arch }}"

      # Prepare test html file
      - name: Prepare test html file
        run: |
          sed "s/RANDOMLY_GENERATED_GIBBERISH/$(cat /dev/urandom | tr -dc 'a-f0-9' | head -c 64)/g" test/index.html.template > test/index.html

      # Run the container
      - name: Run container
        run: |
          docker run -d -p 8080:80 --name test-container -v ./test/index.html:/static/index.html "$IMAGE"
          sleep 5 # Allow some time for the container to start

      # Test with curl
      - name: Test the webpage
        run: |
          curl --fail -s http://localhost:8080 > test/received.html
          diff test/index.html test/received.html

      # Test IPv6 listening inside the container
      - name: Test IPv6
        run: |
          docker logs test-container 2>&1 | grep -q "Enabled listen on IPv6"
          docker exec test-container wget -qO- 'http://[::1]/' > test/received-ipv6.html
          diff test/index.html test/received-ipv6.html

      # The entrypoint must not prevent startup on a read-only root filesystem
      - name: Test read-only container
        run: |
          docker run -d -p 8081:80 --name test-readonly --read-only --tmpfs /run --tmpfs /var/cache/nginx -v ./test/index.html:/static/index.html "$IMAGE"
          sleep 5
          curl --fail -s http://localhost:8081 > test/received-readonly.html
          diff test/index.html test/received-readonly.html

      # Clean up the container
      - name: Clean up
        if: always()
        run: |
          docker rm -f test-container test-readonly

  # Single status check for the branch ruleset on main, independent of the
  # matrix. Runs even if a test job failed, because a skipped required check
  # would count as passed.
  build-and-test:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: All architectures passed
        run: test "${{ needs.test.result }}" = success
